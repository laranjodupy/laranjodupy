name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 3h (UTC)
  workflow_dispatch: {} # também permite rodar manualmente pelo botão "Run workflow"
  push:
    branches:
      - main

jobs:
  gerar-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVG da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: laranjodupy
          outputs: |
            dist/github-snake.svg?color_snake=%23F7D51D&color_dots=%232b2b40,%236EC1E4,%234A9FD6,%23336791,%230F3A5C
            dist/github-snake-dark.svg?color_snake=%23F7D51D&color_dots=%232b2b40,%236EC1E4,%234A9FD6,%23336791,%230F3A5C

      - name: Publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}